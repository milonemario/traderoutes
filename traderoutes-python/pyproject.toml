[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "traderoutes"
version = "0.0.2"
description = "Compute weighted international trade routes on a worldwide network."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.4.4",
  "igraph>=0.11.8",
  "simplekml>=1.3.6",
  "geopy>=2.4.1"
]
authors = [
  {name = "Mario Milone", email = "milonemario@gmail.com"}
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["trade routes", "transportation network", "graph", "geography"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/milonemario/traderoutes"
Repository = "https://github.com/milonemario/traderoutes"
Issues = "https://github.com/milonemario/traderoutes/issues"

[tool.setuptools.package-data]
traderoutes = ["assets/*.pkl"]
