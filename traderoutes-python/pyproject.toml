[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traderoutes"
version = "0.0.1"
description = "Package to get trade routes worldwide."
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.4.4",
  "igraph>=0.11.8",
  "simplekml>=1.3.6",
  "geopy>=2.4.1"
]
authors = [
  {name = "Mario Milone", email = "milonemario@gmail.com"}
]
license = { text = "MIT"}
readme = "README.md"

